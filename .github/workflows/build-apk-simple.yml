# 2024년 8월 테스트된 성공적인 Kivy APK 빌드 워크플로우
# 출처: https://gist.github.com/zl475505/25245e8d28b13b3273e8bae1a63c4af2
name: 🎵 성경 MP3 플레이어 APK 빌드 (간단 버전)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 타입을 선택하세요'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: 🤖 Android APK 빌드
    runs-on: ubuntu-latest

    steps:
    - name: 📥 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: ☕ Java 17 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'

    - name: 🤖 Android SDK 사전 설치
      uses: android-actions/setup-android@v3
      with:
        api-level: 30
        build-tools: 30.0.3
        cmdline-tools-version: latest

    - name: 📱 추가 Android 컴포넌트 설치
      run: |
        echo "=== Android SDK 환경 설정 ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

        # 필요한 모든 build-tools 버전 설치
        echo "=== 모든 필요한 build-tools 설치 ==="
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

        # buildozer가 요구하는 최신 build-tools도 설치
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.1.0" || echo "36.1.0 설치 실패, 계속 진행"

        # 기타 필수 컴포넌트
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"

        echo "=== 설치 확인 ==="
        ls -la "$ANDROID_HOME/build-tools/"
        find "$ANDROID_HOME" -name "aidl" -type f || echo "AIDL 검색 결과 없음"

    - name: 🔧 Buildozer 의존성 설치
      run: |
        echo "=== 시스템 의존성 설치 ==="
        sudo apt update
        sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev automake
        
        echo "=== Python 패키지 설치 ==="
        pip install --user --upgrade Cython virtualenv
        pip install --user --upgrade buildozer
        
        echo "=== 프로젝트 의존성 설치 ==="
        if [ -f requirements.txt ]; then
            pip install --user -r requirements.txt
        fi

    - name: ☕ Java 경로 설정 (중요!)
      run: |
        echo "=== Java 환경 설정 ==="
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        sudo update-java-alternatives --set $JAVA_HOME
        export PATH=$JAVA_HOME/bin:$PATH
        
        echo "Java 버전 확인:"
        java -version
        
        # 환경 변수 설정
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

    - name: 📱 APK 빌드 실행
      run: |
        echo "=== Buildozer APK 빌드 시작 ==="
        
        # 빌드 전 환경 확인
        echo "=== 빌드 환경 확인 ==="
        echo "Python 버전: $(python3 --version)"
        echo "Java 버전: $(java -version 2>&1 | head -1)"
        echo "Buildozer 버전: $(buildozer --version 2>/dev/null || echo '버전 확인 불가')"
        echo "Working Directory: $(pwd)"
        echo "Contents: $(ls -la)"
        
        # main.py 파일 확인
        if [ ! -f main.py ]; then
            echo "❌ main.py 파일이 없습니다!"
            echo "사용 가능한 Python 파일들:"
            ls -la *.py || echo "Python 파일 없음"
            echo "임시로 main.py 생성..."
            if [ -f kivy_main.py ]; then
                cp kivy_main.py main.py
                echo "✅ kivy_main.py를 main.py로 복사"
            elif [ -f kivy_onedrive_main.py ]; then
                cp kivy_onedrive_main.py main.py
                echo "✅ kivy_onedrive_main.py를 main.py로 복사"
            else
                echo "from kivy.app import App" > main.py
                echo "from kivy.uix.label import Label" >> main.py
                echo "class TestApp(App):" >> main.py
                echo "    def build(self):" >> main.py
                echo "        return Label(text='Hello World')" >> main.py
                echo "TestApp().run()" >> main.py
                echo "✅ 기본 main.py 생성"
            fi
        fi
        
        # buildozer.spec 확인
        if [ ! -f buildozer.spec ]; then
            echo "buildozer.spec 파일이 없습니다. 초기화합니다..."
            buildozer init
        fi
        
        # buildozer 기본 테스트
        echo "=== buildozer 기본 테스트 ==="
        
        # buildozer 설치 확인
        echo "빌드자 설치 상태:"
        which buildozer || echo "buildozer 명령을 찾을 수 없음"
        buildozer --version || echo "buildozer 버전 확인 실패"
        
        # buildozer 도움말 확인
        echo "\nbuildozer 도움말 테스트:"
        buildozer --help | head -10 || echo "buildozer 도움말 실패"
        
        # PATH 확인
        echo "\n현재 PATH:"
        echo $PATH
        
        # Python 패키지 확인
        echo "\n설치된 Python 패키지:"
        pip list | grep -E "(buildozer|cython|kivy)" || echo "관련 패키지 없음"
        
        # 지원되는 플랫폼 확인
        echo "\nbuildozer 지원 플랫폼:"
        buildozer android --help 2>&1 | head -5 || echo "android 플랫폼 도움말 실패"
        
        # Android SDK 환경 검증 (사전 설치된 SDK 사용)
        echo "\n=== Android SDK 환경 검증 ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

        # buildozer가 사전 설치된 SDK를 사용하도록 환경변수 고정
        export BUILDOZER_ANDROID_SDK_PATH=$ANDROID_HOME
        export BUILDOZER_ANDROID_API=30
        export BUILDOZER_ANDROID_BUILD_TOOLS=30.0.3

        # 사전 설치된 SDK 환경 완전 검증
        echo "=== 사전 설치된 Android SDK 검증 ==="
        echo "build-tools 설치 상태:"
        ls -la "$ANDROID_HOME/build-tools/" || echo "build-tools 디렉토리 없음"

        echo "AIDL 도구 위치:"
        find "$ANDROID_HOME" -name "aidl" -type f 2>/dev/null || echo "AIDL 도구 미발견"

        echo "설치된 패키지 목록:"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -15

        # buildozer가 자체 SDK 다운로드를 시도하지 않도록 디렉토리 생성
        mkdir -p ~/.buildozer/android/platform/
        ln -sf "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk
        echo "buildozer용 SDK 심볼릭 링크 생성 완료"

        BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
        echo "\n=== APK 빌드 시작 (BUILD_TYPE: $BUILD_TYPE) ==="
        
        # 빌드 전 로그 디렉토리 생성
        mkdir -p .buildozer/logs
        
        # buildozer 명령 실행 (단계별 디버깅)
        echo "buildozer android $BUILD_TYPE 실행 중..."

        # 직접 실행하여 오류 상세 정보 확인
        set +e  # 오류에도 계속 진행

        # buildozer clean 후 실행 (캐시 초기화)
        echo "buildozer clean 실행 중..."
        buildozer android clean > clean_output.log 2>&1 || echo "clean 완료"

        # 사전 설치된 SDK로 buildozer 직접 실행 (최대 상세 로깅)
        echo "사전 설치된 Android SDK 환경에서 buildozer 실행..."
        echo "buildozer 실행 전 최종 환경 확인:"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "BUILDOZER_ANDROID_SDK_PATH: $BUILDOZER_ANDROID_SDK_PATH"

        # buildozer 실행 (실시간 출력 + 로그 저장)
        set +e
        buildozer -v android $BUILD_TYPE 2>&1 | tee build_output.log
        BUILD_EXIT_CODE=$?
        set -e
        
        echo "\n=== buildozer 종료 (exit code: $BUILD_EXIT_CODE) ==="
        
        if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ buildozer 빌드 성공!"
            echo "\n=== 성공 로그 마지막 20줄 ==="
            if [ -f build_output.log ]; then
                tail -20 build_output.log
            fi
        else
            echo "❌ buildozer 빌드 실패! (exit code: $BUILD_EXIT_CODE)"
            
            echo "\n=== 빌드 출력 로그 ==="
            if [ -f build_output.log ]; then
                LOG_SIZE=$(wc -l < build_output.log)
                echo "빌드 출력 로그 크기: $LOG_SIZE 줄"
                
                if [ $LOG_SIZE -gt 0 ]; then
                    echo "\n--- 전체 로그 내용 ---"
                    cat build_output.log
                    echo "\n--- 로그 끝 ---"
                else
                    echo "build_output.log 파일이 비어있습니다."
                fi
            else
                echo "build_output.log 파일이 생성되지 않았습니다."
            fi

            # 빌드 실패 원인 분석
            echo "=== 빌드 실패 원인 분석 ==="

            echo "Python 관련 오류 검색:"
            grep -i "python\|pip\|cython" build_output.log | tail -10 || echo "Python 오류 없음"

            echo "NDK 관련 오류 검색:"
            grep -i "ndk\|gcc\|clang" build_output.log | tail -10 || echo "NDK 오류 없음"

            echo "Kivy 관련 오류 검색:"
            grep -i "kivy\|recipe" build_output.log | tail -10 || echo "Kivy 오류 없음"

            echo "권한 관련 오류 검색:"
            grep -i "permission\|denied\|cannot" build_output.log | tail -10 || echo "권한 오류 없음"

            echo "마지막 실행 명령 검색:"
            grep -A5 -B5 "failed to execute\|last command" build_output.log || echo "마지막 명령 정보 없음"

            echo ""
            echo "=== 다른 로그 파일 검색 ==="
            ls -la *.log 2>/dev/null || echo "로그 파일 없음"

            echo ""
            echo "=== LICENSE OUTPUT LOG ==="
            if [ -f license_output.log ]; then
                echo "license_output.log 크기: $(wc -l < license_output.log) 줄"
                echo "--- license_output.log 전체 내용 ---"
                cat license_output.log
                echo "--- license_output.log 끝 ---"
            else
                echo "license_output.log 파일 없음"
            fi

            echo ""
            echo "=== BUILD RETRY LOG ==="
            if [ -f build_output_retry.log ]; then
                echo "build_output_retry.log 크기: $(wc -l < build_output_retry.log) 줄"
                echo "--- build_output_retry.log 전체 내용 ---"
                cat build_output_retry.log
                echo "--- build_output_retry.log 끝 ---"
            else
                echo "build_output_retry.log 파일 없음"
            fi

            echo ""
            echo "=== ORIGINAL BUILD LOG 마지막 50줄 ==="
            if [ -f build_output.log ]; then
                tail -50 build_output.log
            else
                echo "build_output.log 파일 없음"
            fi

            echo "\n=== .buildozer 디렉토리 확인 ==="
            if [ -d .buildozer ]; then
                ls -la .buildozer/
                find .buildozer -type f -name "*.log" 2>/dev/null | head -5 || echo ".buildozer 내 로그 파일 없음"
            else
                echo ".buildozer 디렉토리가 생성되지 않았습니다."
            fi
            
            # 강제로 모든 로그 출력 (에러와 관계없이)
            echo ""
            echo "========================="
            echo "FORCE LOG OUTPUT START"
            echo "========================="

            echo "모든 로그 파일 목록:"
            ls -la *.log 2>/dev/null || echo "로그 파일 목록 없음"

            echo ""
            echo "--- LICENSE LOG FORCE OUTPUT ---"
            cat license_output.log 2>/dev/null || echo "license_output.log 없음"

            echo ""
            echo "--- RETRY LOG FORCE OUTPUT ---"
            cat build_output_retry.log 2>/dev/null || echo "build_output_retry.log 없음"

            echo ""
            echo "--- ORIGINAL LOG LAST 100 LINES ---"
            tail -100 build_output.log 2>/dev/null || echo "build_output.log 없음"

            echo ""
            echo "========================="
            echo "FORCE LOG OUTPUT END"
            echo "========================="

            exit $BUILD_EXIT_CODE
        fi

    - name: 📂 빌드 결과 확인 및 APK 검색
      run: |
        echo "=== 빌드 결과 확인 ==="
        echo "현재 디렉토리 구조:"
        ls -la

        echo "bin 폴더 확인:"
        ls -la bin/ 2>/dev/null || echo "bin 폴더가 없습니다."

        echo "전체 프로젝트에서 APK 파일 검색:"
        find . -name "*.apk" -type f 2>/dev/null || echo "APK 파일을 찾을 수 없습니다."

        echo ".buildozer 디렉토리에서 APK 검색:"
        find .buildozer -name "*.apk" -type f 2>/dev/null || echo ".buildozer에 APK 없음"

        echo "dist 폴더 확인:"
        ls -la dist/ 2>/dev/null || echo "dist 폴더가 없습니다."

    - name: 🚀 APK 파일 업로드
      uses: actions/upload-artifact@v4
      if: always()  # 빌드 성공 여부와 관계없이 APK 파일이 있으면 업로드
      with:
        name: bible-mp3-player-${{ github.event.inputs.build_type || 'debug' }}-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/dist/*.apk
          dist/*.apk
          **/*.apk

    - name: ✅ 빌드 완료 알림
      if: success()
      run: |
        echo "🎉 APK 빌드가 성공적으로 완료되었습니다!"
        echo "📱 APK 파일을 Artifacts에서 다운로드할 수 있습니다."
        
    - name: ❌ 빌드 실패 시 디버깅 정보
      if: failure()
      run: |
        echo "❌ 빌드가 실패했습니다. 디버깅 정보:"
        echo "=== buildozer.spec 내용 ==="
        cat buildozer.spec || echo "buildozer.spec 파일 없음"
        echo "=== .buildozer 로그 ==="
        find .buildozer -name "*.log" -exec cat {} \; 2>/dev/null || echo "buildozer 로그 없음"